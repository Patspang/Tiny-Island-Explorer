name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip until project is scaffolded
        if: hashFiles('package.json') == ''
        run: echo "::notice::No package.json yet - nothing to check."

      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: hashFiles('package.json') != ''
        run: npm ci

      - name: Type check
        if: hashFiles('package.json') != ''
        run: npx tsc --noEmit

      - name: Build
        if: hashFiles('package.json') != ''
        run: npm run build
