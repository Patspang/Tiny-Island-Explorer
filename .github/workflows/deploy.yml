name: Deploy

# Publishes the built game to GitHub Pages on every push to main.
# Requires Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.scaffold.outputs.ready }}
    steps:
      - uses: actions/checkout@v4

      - id: scaffold
        run: |
          if [ -f package.json ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "ready=false" >> "$GITHUB_OUTPUT"; echo "::notice::No package.json yet - nothing to deploy."; fi

      - uses: actions/setup-node@v4
        if: steps.scaffold.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.scaffold.outputs.ready == 'true'
        run: npm ci
      - if: steps.scaffold.outputs.ready == 'true'
        run: npm run build
      - if: steps.scaffold.outputs.ready == 'true'
        uses: actions/configure-pages@v5
      - if: steps.scaffold.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
